server.port=${PORT:8080}
spring.application.name=placement-monitoring-system

# Database Configuration (H2 In-Memory DB)
spring.datasource.url=jdbc:h2:mem:placementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# App Custom Properties
placement.jwt.secret=${JWT_SECRET:9a2f8c4e7b1d3f6a8e0c2b4d6f8a1c3e5b7d9f2a4c6e8b0d2f4a6c8e0b2d4f6a}
placement.jwt.expiration-ms=86400000
placement.nlp-service.url=${NLP_SERVICE_URL:http://localhost:5000}

# =================================================================
# EMAIL / SMTP CONFIGURATION
# Set these as environment variables in Railway dashboard:
#   MAIL_USERNAME = your Gmail address
#   MAIL_PASSWORD = your Gmail App Password (without spaces)
# =================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:YOUR_GMAIL@gmail.com}
spring.mail.password=${MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

